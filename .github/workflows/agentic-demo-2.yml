name: Agentic Real-Time Responder
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  agentic-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Respond to user interactions in real-time
        uses: actions/github-script@v7
        with:
          script: |
            const user = context.payload.sender.login;
            let responseBody = '';
            let targetNumber = null;
            let isIssue = false;
            
            // Handle new issues
            if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              targetNumber = issue.number;
              isIssue = true;
              responseBody = `👋 Hello @${user}! Thanks for opening this issue. An agent is analyzing your request...`;
            }
            
            // Handle issue comments
            else if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment.body.toLowerCase();
              targetNumber = context.payload.issue.number;
              isIssue = !context.payload.issue.pull_request;
              
              if (comment.includes('help') || comment.includes('status')) {
                responseBody = `🤖 @${user}, I'm here to help! This is an Agentic DevOps demo responding to your real-time request.`;
              }
            }
            
            // Handle new PRs
            else if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              targetNumber = pr.number;
              responseBody = `👋 Welcome @${user}! Your PR is being reviewed by our agentic system. Demo mode active!`;
            }
            
            // Handle PR review comments
            else if (context.eventName === 'pull_request_review_comment') {
              targetNumber = context.payload.pull_request.number;
              responseBody = `🔍 @${user}, I saw your review comment! Agentic response triggered in real-time.`;
            }
            
            // Post response if we have content
            if (responseBody && targetNumber) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: targetNumber,
                body: responseBody
              });
              console.log(`✅ Real-time response sent to ${isIssue ? 'issue' : 'PR'} #${targetNumber} for user @${user}`);
            } else {
              console.log("ℹ️ No response triggered for this event");
            }
