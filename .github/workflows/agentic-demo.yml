name: Agentic Hello World

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  agentic-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Greet PR if commit message contains 'hello'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            if (commits.data.some(c => c.commit.message.toLowerCase().includes('hello'))) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: "👋 Hello, welcome! This is an Agentic DevOps demo."
              });
              console.log("Welcome comment posted!");
            } else {
              console.log("No commit message contained 'hello'. No comment posted.");
            }
