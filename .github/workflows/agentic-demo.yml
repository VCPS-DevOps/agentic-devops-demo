name: Agentic Hello World

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  agentic-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Greet PR if title or body contains 'hello'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const msg = `${pr.title}\n${pr.body || ''}`.toLowerCase();
            if (msg.includes('hello')) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: "👋 Hello, welcome! This is an Agentic DevOps demo."
              });
              console.log("Welcome comment posted!");
            } else {
              console.log("No 'hello' found in PR title/body. No comment posted.");
            }
